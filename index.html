<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#120e17" />
    <title>Stones</title>
    <link rel="icon" href="data:," />
    <style>
      /* La página no se mueve ni se acerca (iPhone/iPad): el juego la llena y todo lo demás flota encima. */
      html,
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #120e17;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* main.js lo pone donde toca (zoom, franjas de los controles y zonas seguras). */
      #game {
        position: fixed;
        left: 0;
        top: 0;
        touch-action: none;
      }
      #game canvas {
        display: block;
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* iOS acerca la página al escribir en un campo con letra de menos de 16 px (nombre, chat). */
      input,
      textarea,
      select {
        font-size: 16px !important;
        touch-action: manipulation;
        -webkit-user-select: text;
        user-select: text;
      }
      /* Tableta con los controles abajo: el micrófono y el chat del modo en línea bajan a la franja,
         junto a la pausa (en celular siguen en la franja izquierda, como los pone hud.js). */
      html.touch-bottom #net .tbtn {
        top: auto !important;
        left: calc(50% + 34px) !important;
        bottom: calc(15px + env(safe-area-inset-bottom, 0px));
      }
      html.touch-bottom #net .tbtn ~ .tbtn {
        left: calc(50% + 90px) !important;
      }
      /* Celular acostado (controles encima del juego): el micrófono y el chat, semitransparentes y fuera de la muesca. */
      html.touch-over #net .tbtn {
        margin-left: max(0px, calc(env(safe-area-inset-left, 0px) - 12px));
      }
      html.touch-over #net .tbtn:not(.down) {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
